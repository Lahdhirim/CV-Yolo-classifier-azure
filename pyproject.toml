[project]
name = "cv-tunisian-food-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
    "ultralytics>=8.4.92",
    "torch",
    "torchvision"
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121" }
]
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
    "ipykernel>=7.3.0"
]
