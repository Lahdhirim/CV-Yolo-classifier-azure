[project]
name = "cv-tunisian-food-classifier"
version = "0.1.0"
description = "Fine-tuning Yolo models on custom image classification dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
    "ultralytics>=8.4.92",
    "torch",
    "torchvision",
    "typer>=0.26.8",
    "pandas>=3.0.3",
    "openpyxl>=3.1.5",
    "dotenv>=0.9.9",
    "azure-ai-ml>=1.34.1",
    "azure-identity>=1.25.3",
    "uvicorn>=0.52.4",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121" }
]
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
    "ipykernel>=7.3.0"
]
